<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Portal | Y.S.M Education</title>
    <link rel="icon" type="image/png" href="/static/img/ysm_logo.png">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/premium_motion.css">
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="smooth-wrapper">
        <div id="smooth-content">
            <div class="dashboard-bg"></div>
            <div class="dashboard-container">
                <!-- Sidebar -->
                <aside class="dash-sidebar">
                    <div class="dash-brand">
                        <img src="/static/img/ysm_logo.png" alt="Y.S.M"
                            style="width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(218,165,32,0.6));">
                        PARENT
                    </div>

                    <div class="dash-nav">
                        <a href="#" class="dash-item active">📊 Overview</a>
                        <a href="#" class="dash-item">👶 My Children</a>
                        <a href="#" class="dash-item">💰 Fees & Invoices</a>
                        <a href="#" class="dash-item">📝 Report Cards</a>
                        <a href="#" class="dash-item">📢 School Notices</a>

                        <div style="margin-top: auto;">
                            <button onclick="logout()" class="dash-item"
                                style="width: 100%; text-align: left; color: #f87171;">
                                🚪 Logout
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- Main Content -->
                <main class="dash-main">
                    <header class="dash-header">
                        <h2 style="font-size: 1.2rem; color: white;">Parent Dashboard</h2>
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <div style="text-align: right;">
                                <div id="parentName" style="color: white; font-weight: 600; font-size: 0.9rem;">
                                    Parent/Guardian
                                </div>
                                <div style="color: #94a3b8; font-size: 0.8rem;">Family Account</div>
                            </div>
                        </div>
                    </header>

                    <div class="dash-content">
                        <div id="childrenContainer">
                            <!-- Dynamic Children Cards -->
                            <p style="color: #94a3b8;">Loading family data...</p>
                        </div>

                        <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div
                                style="background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                                <h3 style="color: white; font-size: 1.1rem; margin-bottom: 15px;">📫 Recent
                                    Notifications</h3>
                                <div id="notificationList" style="display: flex; flex-direction: column; gap: 10px;">
                                    <!-- Populated by JS -->
                                </div>
                            </div>

                            <div
                                style="background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
                                <h3 style="color: white; font-size: 1.1rem; margin-bottom: 15px;">💳 Pending Invoices
                                </h3>
                                <div id="duesList">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>

            <!-- Modals -->
            <div id="leaveModal" class="modal"
                style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center;">
                <div
                    style="background: #1e293b; width: 400px; padding: 30px; border-radius: 20px; border: 1px solid #334155; position: relative;">
                    <h3 style="color: white; margin-top: 0;">Apply Leave</h3>
                    <p id="leaveStudentName" style="color: #94a3b8; font-size: 0.9rem;"></p>

                    <form id="leaveForm" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
                        <input type="hidden" id="leaveStudentId">
                        <div class="form-group">
                            <label style="color: #94a3b8; font-size: 0.8rem;">Leave Type</label>
                            <select id="leaveType" class="form-input"
                                style="background: #0f172a; border-color: #334155; color: white;">
                                <option value="SICK">Sick Leave</option>
                                <option value="CASUAL">Casual / Personal</option>
                                <option value="EMERGENCY">Family Emergency</option>
                            </select>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label style="color: #94a3b8; font-size: 0.8rem;">Start Date</label>
                                <input type="date" id="leaveStart" class="form-input"
                                    style="background: #0f172a; border-color: #334155; color: white;">
                            </div>
                            <div class="form-group">
                                <label style="color: #94a3b8; font-size: 0.8rem;">End Date</label>
                                <input type="date" id="leaveEnd" class="form-input"
                                    style="background: #0f172a; border-color: #334155; color: white;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label style="color: #94a3b8; font-size: 0.8rem;">Reason</label>
                            <textarea id="leaveReason" class="form-input" placeholder="Explain the reason..."
                                style="background: #0f172a; border-color: #334155; color: white; height: 80px;"></textarea>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button type="button" onclick="closeLeaveModal()"
                                style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: transparent; color: white; cursor: pointer;">Cancel</button>
                            <button type="submit"
                                style="flex: 1; padding: 12px; border-radius: 10px; border: none; background: #3b82f6; color: white; font-weight: 700; cursor: pointer;">Submit
                                Request</button>
                        </div>
                    </form>
                </div>
            </div>

            <script src="/static/js/api.js"></script>
            <script src="/static/js/auth.js"></script>
            <script src="/static/js/dashboard/parent.js"></script>
            <script>
                function logout() {
                    localStorage.clear();
                    window.location.href = '/';
                }
            </script>
            <!-- Premium Motion JS -->
            <script src="/static/js/premium_motion.js"></script>
        </div>
    </div>
</body>

</html>
