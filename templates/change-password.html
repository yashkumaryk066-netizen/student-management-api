<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Account | Y.S.M EduCore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ysm-gold: #e2b036;
            --ysm-black: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: var(--ysm-black); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: absolute;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(226, 176, 54, 0.05) 0%, transparent 50%);
            animation: moveBg 20s infinite linear;
            z-index: 0;
        }

        @keyframes moveBg {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .card {
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.9), rgba(10, 10, 10, 0.95));
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8), inset 0 0 0 1px var(--glass-border);
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(20px);
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 100px; height: 2px;
            background: var(--ysm-gold);
            box-shadow: 0 0 20px var(--ysm-gold);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(226, 176, 54, 0.1);
            color: var(--ysm-gold);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2rem;
            transform: rotate(-10deg);
            border: 1px solid rgba(226, 176, 54, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h1 { 
            color: white; 
            font-size: 1.8rem; 
            margin-bottom: 15px; 
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        p { color: #94a3b8; font-size: 1rem; margin-bottom: 35px; line-height: 1.6; }

        .input-group { margin-bottom: 25px; text-align: left; position: relative; }
        
        label { 
            display: block; 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--ysm-gold); 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            outline: none;
            transition: 0.4s;
            font-size: 1rem;
            color: white;
            letter-spacing: 2px;
        }

        input:focus { 
            border-color: var(--ysm-gold); 
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(226, 176, 54, 0.15);
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #b88a1b, #e2b036);
            color: black;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 15px 30px rgba(226, 176, 54, 0.2);
        }

        .btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(226, 176, 54, 0.4); 
            filter: brightness(1.1);
        }

        .btn:disabled { opacity: 0.5; transform: none; cursor: wait; }

        .requirements {
            margin-top: 25px;
            text-align: left;
            background: rgba(239, 68, 68, 0.05);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.1);
            display: none;
        }

        .requirement { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: #f87171; margin-bottom: 8px; }
        .requirement.valid { color: #34d399; }

        .toast {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 35px;
            background: var(--ysm-gold);
            color: black;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: none;
            z-index: 10000;
            animation: slideDown 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-lock-open"></i>
        </div>
        <h1>Set New Password</h1>
        <p>Your account was created with a temporary password. For security, please set a permanent password to continue.</p>

        <form id="changePasswordForm">
            <div class="input-group">
                <label>Current Temporary Password</label>
                <input type="password" id="oldPassword" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>New Permanent Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <div id="errorMsg" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 15px; display: none;"></div>

            <button type="submit" class="btn" id="submitBtn">
                <span>UPDATE PASSWORD</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const form = document.getElementById('changePasswordForm');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            if (newPassword !== confirmPassword) {
                errorMsg.innerText = "Passwords do not match!";
                errorMsg.style.display = 'block';
                return;
            }

            if (newPassword.length < 8) {
                errorMsg.innerText = "Password must be at least 8 characters long.";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> UPDATING...';

            try {
                const res = await fetch('/api/auth/change-password/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                        'Authorization': 'Bearer ' + localStorage.getItem('authToken')
                    },
                    body: JSON.stringify({ 
                        old_password: oldPassword, 
                        new_password: newPassword 
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast("Password updated! Redirecting...");
                    setTimeout(() => {
                        window.location.href = '/login/';
                    }, 2000);
                } else {
                    errorMsg.innerText = data.error || data.message || "Failed to update password.";
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>UPDATE PASSWORD</span> <i class="fa-solid fa-arrow-right"></i>';
                }
            } catch (err) {
                errorMsg.innerText = "Network error. Please try again.";
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>UPDATE PASSWORD</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        };
    </script>
</body>
</html>
