<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <title>Identity Verification | Y.S.M AI</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.4);
            --bg-darker: #020617;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-darker);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: none;
            /* Hide real cursor */
        }

        /* Magic Cursor */
        .magic-cursor {
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .magic-cursor-follower {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, transparent 70%);
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .scanlines {
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.2) 50%, rgba(0, 0, 0, 0.2));
            background-size: 100% 4px;
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        .hud-border {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        .hud-border::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(245, 158, 11, 0.1), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .hud-border:hover::after {
            opacity: 1;
        }

        .hud-border::before,
        .hud-border::after-corner {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            transition: all 0.5s;
        }

        /* Custom decorative corners */
        .corner-tl {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 30px;
            height: 30px;
            border-left: 3px solid var(--primary);
            border-top: 3px solid var(--primary);
        }

        .corner-tr {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 30px;
            height: 30px;
            border-right: 3px solid var(--primary);
            border-top: 3px solid var(--primary);
        }

        .corner-bl {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 30px;
            height: 30px;
            border-left: 3px solid var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .corner-br {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 30px;
            height: 30px;
            border-right: 3px solid var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .text-shimmer {
            background: linear-gradient(90deg, #fff 0%, var(--primary) 50%, #fff 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        input {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary) !important;
            background: rgba(255, 255, 255, 0.07) !important;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2) !important;
            transform: translateY(-2px);
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 3s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        .float-shape {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
            filter: blur(60px);
        }

        .btn-magical {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .btn-magical::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .btn-magical:hover::before {
            left: 100%;
        }

        .btn-magical:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
        }

        @keyframes floatMagic {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(60px, 40px) rotate(30deg);
            }
        }
    </style>
</head>

<body>
    <!-- Magic Cursor -->
    <div class="magic-cursor" id="magicCursor"></div>
    <div class="magic-cursor-follower" id="magicFollower"></div>

    <!-- Background Shapes -->
    <div class="float-shape"
        style="top: 10%; left: 10%; width: 400px; height: 400px; background: rgba(245, 158, 11, 0.1); animation: floatMagic 20s infinite alternate;">
    </div>
    <div class="float-shape"
        style="bottom: 10%; right: 10%; width: 500px; height: 500px; background: rgba(99, 102, 241, 0.1); animation: floatMagic 25s infinite alternate-reverse;">
    </div>

    <div class="scanlines"></div>

    <!-- Auth Container -->
    <div class="hud-border w-full max-w-md p-10 rounded-3xl z-20 relative group">
        <div class="corner-tl"></div>
        <div class="corner-tr"></div>
        <div class="corner-bl"></div>
        <div class="corner-br"></div>

        <div class="scanner-line"></div>

        <div class="text-center mb-10">
            <div
                class="w-20 h-20 bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-2xl shadow-amber-500/30 transform transition-transform group-hover:rotate-12">
                <i class="fa-solid fa-fingerprint text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black font-mono tracking-tighter text-shimmer">IDENTITY VERIFICATION</h1>
            <p class="text-[10px] text-slate-500 mt-2 uppercase tracking-[0.3em] font-bold">Y.S.M Secure Protocol
                v4.0.0-GOLD</p>
        </div>

        <!-- Forms -->
        <div id="auth-forms" class="space-y-6">
            <!-- Email Input -->
            <div class="space-y-2">
                <label class="text-[10px] text-amber-500/60 font-black font-mono ml-1 tracking-widest">ENCRYPTED
                    IDENTIFIER</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-4 text-slate-500"></i>
                    <input type="email" id="email" placeholder="user@quantum.net"
                        class="w-full p-4 pl-12 rounded-xl font-mono placeholder-slate-600 focus:ring-0">
                </div>
            </div>

            <!-- Password -->
            <div class="space-y-2">
                <label class="text-[10px] text-amber-500/60 font-black font-mono ml-1 tracking-widest">SECURITY
                    CIPHER</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-4 top-4 text-slate-500"></i>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full p-4 pl-12 rounded-xl font-mono placeholder-slate-600 focus:ring-0">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-6 grid grid-cols-2 gap-4">
                <button onclick="handleAuth('signup')"
                    class="p-4 rounded-xl border border-white/10 hover:bg-white/5 transition-all text-sm font-mono text-slate-400 btn-magical">
                    <i class="fa-solid fa-user-plus mr-2"></i>INITIATE
                </button>
                <button onclick="handleAuth('login')"
                    class="p-4 rounded-xl bg-gradient-to-r from-amber-600 to-orange-600 hover:scale-105 active:scale-95 transition-all text-sm font-black text-white shadow-xl shadow-amber-500/20 btn-magical">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>ACCESS
                </button>
            </div>

            <p id="status-msg"
                class="text-center text-[10px] font-mono mt-6 min-h-[1.5em] text-cyan-400 tracking-wider uppercase font-bold">
            </p>
        </div>

        <div
            class="mt-8 border-t border-white/5 pt-6 flex justify-between text-[9px] text-slate-600 font-mono tracking-tighter">
            <span class="flex items-center gap-1"><span
                    class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> SYSTEM: NOMINAL</span>
            <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved"></i> E2E ENCRYPTION:
                ACTIVE</span>
        </div>
    </div>

    <script>
        // Magic Motion Engine
        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('magicCursor');
            const follower = document.getElementById('magicFollower');

            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';

            const hud = document.querySelector('.hud-border');
            const rect = hud.getBoundingClientRect();
            hud.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
            hud.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        });

        // Hover scale effect
        document.querySelectorAll('button, input').forEach(el => {
            el.addEventListener('mouseenter', () => document.getElementById('magicCursor').style.transform = 'scale(4)');
            el.addEventListener('mouseleave', () => document.getElementById('magicCursor').style.transform = 'scale(1)');
        });

        async function handleAuth(action) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const status = document.getElementById('status-msg');

            if (!email || !password) {
                status.innerText = ">> CRITICAL ERROR: MISSING_CREDENTIALS";
                status.className = "text-center text-[10px] font-mono mt-6 min-h-[1.5em] text-red-500 animate-pulse tracking-wider uppercase font-bold";
                return;
            }

            status.innerText = action === 'login' ? ">> AUTHENTICATING_NEURAL_LINK..." : ">> REGISTERING_QUANTUM_IDENTITY...";
            status.className = "text-center text-[10px] font-mono mt-6 min-h-[1.5em] text-amber-500 animate-pulse tracking-wider uppercase font-bold";

            try {
                await new Promise(r => setTimeout(r, 1200));

                const response = await fetch('/api/ai/auth/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        action: action,
                        email: email,
                        password: password,
                        phone: '0000000000'
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    status.innerText = ">> ACCESS_GRANTED. DECRYPTING_DASHBOARD...";
                    status.className = "text-center text-[10px] font-mono mt-6 min-h-[1.5em] text-green-500 tracking-wider uppercase font-bold";
                    setTimeout(() => window.location.href = data.redirect, 800);
                } else {
                    throw new Error(data.error || "Access Denied");
                }

            } catch (err) {
                status.innerText = ">> FAILED: " + err.message.toUpperCase();
                status.className = "text-center text-[10px] font-mono mt-6 min-h-[1.5em] text-red-500 tracking-wider uppercase font-bold";
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
