    <style>
        .magic-cursor {
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .magic-cursor-follower {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(226, 176, 54, 0.15) 0%, transparent 70%);
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .float-shape {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
            filter: blur(60px);
        }

        @keyframes floatMagic {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(50px, 30px) rotate(45deg);
            }
        }

        .portal-inner {
            cursor: none;
            position: relative;
        }

        .portal-inner::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(226, 176, 54, 0.08), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 1;
        }

        .portal-inner:hover::after {
            opacity: 1;
        }

        .portal-inner>* {
            position: relative;
            z-index: 2;
        }
    </style>
    <!-- Visual Core Layer -->

                                </div>

                                    <div class="elite-shimmer"></div>
                                    <span id="idLoader" style="display: none; margin-left:10px;">
                                        <i class="fas fa-circle-notch fa-spin"></i>
                                    </span>
                                </button>

                                <div style="margin-top: 20px; text-align: center;">
                                    <div style="font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-bottom: 10px;">
                                        OR AUTHENTICATE WITH</div>

                                    <div style="position:relative; width:80px; height:80px; margin:0 auto;">
                                        <img id="userAvatar" src="/static/img/default-avatar.png"

                                        <div

                                        </div>
                                    </div>
                                    <h3 id="userGreeting"
                                        style="margin-top:12px; font-size:1.1rem; color:white; font-family:'Outfit', sans-serif;">
                                        Welcome Back</h3>
                                    <button type="button" onclick="resetLoginStep()"

                                <div class="elite-input-group">

                <!-- BACK: SYSTEM RECOVERY -->

                            <div class="brand-separator">
                                <span></span>
                                <div class="dot"></div>
                                <span></span>
                            </div>

                            <!-- Step 1 -->

                                <div class="elite-input-group">

                                    <label>4-Digit Authentication Code</label>
                                </div>
                                <div class="elite-input-group">
                                    <input type="password" id="newPassword" placeholder=" " required>
                                    <label>Apply New Protection Key</label>
                                </div>
                                <button onclick="confirmReset()" id="btnReset" class="btn-elite-glow">

                                </button>
                            </div>
                        </div>

                        <div class="portal-options centered" style="justify-content:center; margin-top:30px;">

                                Terminal</button>

    <!-- Transition Engine Overlay -->
    <div id="portal-transition">
        <div class="kinetic-logo">Y.S.M</div>
        <div class="kinetic-status">SYNCHRONIZING SECURE CHANNELS...</div>
        <div
            style="width: 250px; height: 1px; background: rgba(255,255,255,0.05); margin-top:30px; position:relative; overflow:hidden;">
            <div id="transProgress"

    <!-- Scripts -->
    <script src="/static/js/api.js?v=6.0"></script>
    <script src="/static/js/auth.js?v=6.0"></script>
    <script src="/static/js/premium_modal.js?v=6.0"></script>
    <script src="/static/js/login_premium.js?v=6.0"></script>

    <script>
        // PREMIUM IDENTITY DETECTION
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const inst = urlParams.get('inst');
            const target = document.getElementById('systemIdentity');

            if (inst) {
                if (inst.toLowerCase() === 'superadmin') {
                    target.innerHTML = `<span style="color: #ef4444; font-weight: 800; letter-spacing: 1px;">🔐 SUPER-ADMIN CONSOLE</span>`;
                    document.querySelector('.brand-ysm').style.color = '#ef4444';
                    document.querySelector('.brand-ysm').style.textShadow = '0 0 20px rgba(239, 68, 68, 0.5)';
                } else {
                    target.innerHTML = `Verified Node: <span style="color: #f59e0b; font-weight: 800;">${decodeURIComponent(inst)}</span>`;
                }
            }
        });

        function flipFace(deg) {
            gsap.to('#portalFlipper', {
                rotationY: deg,
                duration: 1.2,
                ease: "expo.inOut"
            });
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function requestOTP() {
            const identifier = document.getElementById('resetIdentifier').value.trim();
            const btn = document.getElementById('btnGetOTP');
            if (!identifier) return showToast("Handle required", "error");
            btn.disabled = true; btn.querySelector('span').innerText = "TRANSMITTING...";
            try {
                const res = await fetch('/api/auth/password-reset/request/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ identifier })
                });
                if (res.ok) {
                    document.getElementById('recStep1').style.display = 'none';
                    document.getElementById('recStep2').style.display = 'block';
                    showToast("Code Sent to Registered Email", "success");
                } else {
                    const data = await res.json();
                    showToast(data.error || "Broadcast Failed", "error");
                }
            } catch (e) { console.error(e); showToast("Network Desync", "error"); }
            finally { btn.disabled = false; btn.querySelector('span').innerText = "TRANSMIT SECURITY CODE"; }
        }

        async function confirmReset() {
            const identifier = document.getElementById('resetIdentifier').value.trim();
            const otp = document.getElementById('resetOTP').value.trim();
            const pass = document.getElementById('newPassword').value.trim();
            const btn = document.getElementById('btnReset');
            if (!otp || !pass) return showToast("All keys required", "error");
            btn.disabled = true; btn.querySelector('span').innerText = "OVERWRITING...";
            try {
                const res = await fetch('/api/auth/password-reset/confirm/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ identifier, otp, new_password: pass })
                });
                const data = await res.json();
                if (res.ok) {
                    flipFace(0);
                    showToast("Protocol Restored Successfully", "success");
                    document.getElementById('usernameInput').value = data.username;
                    document.getElementById('password').value = data.password; // Auto-fill
                } else {
                    showToast(data.error || "Sync Denied", "error");
                }
            } catch (e) { showToast("Network Desync", "error"); }
            finally { btn.disabled = false; btn.querySelector('span').innerText = "SIGN NEW PROTOCOL"; }
        }
        // Magic Motion Engine
        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('magicCursor');
            const follower = document.getElementById('magicFollower');

            if (cursor && follower) {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
                follower.style.left = e.clientX + 'px';
                follower.style.top = e.clientY + 'px';
            }

            document.querySelectorAll('.portal-inner').forEach(card => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });
        });

        document.querySelectorAll('button, input, a').forEach(el => {
            el.addEventListener('mouseenter', () => {
                const mc = document.getElementById('magicCursor');
                if (mc) mc.style.transform = 'scale(4)';
            });
            el.addEventListener('mouseleave', () => {
                const mc = document.getElementById('magicCursor');
                if (mc) mc.style.transform = 'scale(1)';
            });
        });
    </script>
