<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - NextGen ERP</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            background: var(--bg-darker);
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            cursor: none;
        }

        .student-portal {
            background: var(--bg-darker);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        .portal-header {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .text-shimmer {
            background: linear-gradient(90deg, #fff 0%, var(--primary) 50%, #fff 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }

        .magical-card {
            background: var(--glass) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid var(--border) !important;
            border-radius: 24px !important;
            padding: 30px;
            margin-bottom: 25px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .magical-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.06), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .magical-card:hover::after {
            opacity: 1;
        }

        .magical-card:hover {
            transform: translateY(-10px);
            border-color: rgba(99, 102, 241, 0.5) !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-box:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.4);
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-action:hover {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            transform: translateY(-3px);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 15px;
            color: #94a3b8;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        /* Magic Cursor */
        .magic-cursor {
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            transition: transform 0.1s ease;
        }

        .magic-cursor-follower {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .float-shape {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            opacity: 0.4;
            filter: blur(60px);
        }
    </style>
</head>

<body>
    <!-- Magic Cursor -->
    <div class="magic-cursor" id="magicCursor"></div>
    <div class="magic-cursor-follower" id="magicFollower"></div>

    <!-- Background Shapes -->
    <div class="float-shape"
        style="top: 10%; left: 5%; width: 400px; height: 400px; background: #6366f1; animation: floatMagic 20s infinite alternate;">
    </div>
    <div class="float-shape"
        style="bottom: 10%; right: 5%; width: 500px; height: 500px; background: #a855f7; animation: floatMagic 25s infinite alternate-reverse;">
    </div>

    <div class="student-portal">
        <div class="portal-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="text-shimmer"
                        style="margin: 0; font-size: 3rem; font-weight: 900; letter-spacing: -1px;">👋 Welcome, <span
                            id="studentName">Student</span></h1>
                    <div style="display: flex; gap: 20px; margin-top: 15px;">
                        <span
                            style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); padding: 5px 15px; border-radius: 10px; font-size: 0.8rem; color: #a5b4fc; font-weight: 600;">
                            <i class="fa-solid fa-id-card mr-2"></i> ID: <span id="rollNumber">--</span>
                        </span>
                        <span
                            style="background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2); padding: 5px 15px; border-radius: 10px; font-size: 0.8rem; color: #d8b4fe; font-weight: 600;">
                            <i class="fa-solid fa-graduation-cap mr-2"></i> GRADE: <span id="studentClass">--</span>
                        </span>
                    </div>
                </div>
                <button onclick="logout()" class="btn-action"
                    style="background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); padding: 15px 30px; font-weight: 800; letter-spacing: 1px;">
                    <i class="fa-solid fa-power-off"></i> DISCONNECT
                </button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-value" id="attendanceRate">--%</div>
                <div class="stat-label">Attendance Rate</div>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #a855f7, #9333ea);">
                <div class="stat-value" id="totalClasses">--</div>
                <div class="stat-label">Total Classes</div>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                <div class="stat-value" id="pendingFees">₹--</div>
                <div class="stat-label">Pending Fees</div>
            </div>
            <div class="stat-box" style="background: linear-gradient(135deg, #ec4899, #db2777);">
                <div class="stat-value" id="assignments">--</div>
                <div class="stat-label">Assignments</div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="magical-card">
            <h2 style="margin-top: 0; font-size: 1.5rem;"><i class="fa-solid fa-wand-sparkles text-amber-500"></i> Quick
                Actions</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px;">
                <button class="btn-action" onclick="viewAttendance()"><i class="fa-solid fa-chart-line"></i>
                    Attendance</button>
                <button class="btn-action" onclick="viewResults()"><i class="fa-solid fa-square-poll-vertical"></i>
                    Results</button>
                <button class="btn-action" onclick="downloadReportCard()"><i class="fa-solid fa-file-invoice"></i>
                    Report Card</button>
                <button class="btn-action" onclick="viewTimetable()"><i class="fa-solid fa-calendar-days"></i>
                    Timetable</button>
                <button class="btn-action" onclick="viewAssignments()"><i class="fa-solid fa-file-signature"></i>
                    Assignments</button>
                <button class="btn-action" onclick="viewFees()"><i class="fa-solid fa-indian-rupee-sign"></i> Fee
                    Status</button>
                <a href="/ai-chat/" class="btn-action"
                    style="background: linear-gradient(135deg, #f59e0b, #f97316); border: none; text-decoration: none;">
                    <i class="fa-solid fa-robot"></i> Ask Y.S.M AI
                </a>
            </div>
        </div>

        <!-- Academic DNA -->
        <div class="magical-card" style="margin-bottom: 25px;">
            <h2 style="margin-top: 0; display:flex; align-items:center; gap:10px;"><i
                    class="fa-solid fa-dna text-purple-500"></i> Academic DNA Analysis</h2>
            <div style="height: 350px; position: relative; display: flex; justify-content: center;">
                <canvas id="academicDNAChart"></canvas>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 25px;">
            <!-- Recent Attendance -->
            <div class="magical-card">
                <h2 style="margin-top: 0;"><i class="fa-solid fa-clock-rotate-left"></i> Recent Attendance</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Marked By</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTable">
                        <tr>
                            <td colspan="3" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Upcoming Exams -->
            <div class="magical-card">
                <h2 style="margin-top: 0;"><i class="fa-solid fa-pencil"></i> Upcoming Exams</h2>
                <div id="examsList" style="color: #94a3b8; font-size: 0.9rem;">
                    No upcoming exams scheduled.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const API_BASE = window.location.origin + '/api';
        const token = localStorage.getItem('authToken');

        if (!token) window.location.href = '/';

        async function loadStudentData() {
            try {
                const res = await fetch(`${API_BASE}/profile/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('studentName').textContent = data.user.first_name || data.user.username;
                if (data.student_profile) {
                    document.getElementById('rollNumber').textContent = data.student_profile.roll_number || '--';
                    document.getElementById('studentClass').textContent = data.student_profile.grade || '--';
                }
            } catch (e) { console.error(e); }
        }

        async function loadAttendance() {
            try {
                const res = await fetch(`${API_BASE}/attendence/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const records = (data.results || data).filter(r => r.is_present !== undefined); // Ensure valid records
                const tbody = document.getElementById('attendanceTable');
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center">No records found</td></tr>';
                    return;
                }
                tbody.innerHTML = records.slice(0, 10).map(r => `
                    <tr>
                        <td>${r.date}</td>
                        <td><span class="status-badge status-${r.is_present ? 'active' : 'inactive'}">${r.is_present ? 'Present' : 'Absent'}</span></td>
                        <td>${r.created_by || 'System'}</td>
                    </tr>
                `).join('');
                const present = records.filter(r => r.is_present).length;
                const rate = records.length > 0 ? Math.round((present / records.length) * 100) : 0;
                document.getElementById('attendanceRate').textContent = rate + '%';
                document.getElementById('totalClasses').textContent = records.length;
            } catch (e) { console.error(e); }
        }

        async function loadAcademicDNA() {
            // Mock Data until Result API is fully populated
            // In production, fetch from /api/my-results/
            const ctx = document.getElementById('academicDNAChart').getContext('2d');

            // Magic Gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(99, 102, 241, 0.5)');
            gradient.addColorStop(1, 'rgba(168, 85, 247, 0.1)');

            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Mathematics', 'Science', 'English', 'History', 'Computer Science', 'Arts'],
                    datasets: [{
                        label: 'Academic Performance',
                        data: [85, 90, 75, 80, 95, 70], // Replace with API data
                        fill: true,
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderColor: '#6366f1',
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#6366f1',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: '#6366f1'
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            pointLabels: { color: '#cbd5e1', font: { size: 12 } },
                            ticks: { display: false, backdropColor: 'transparent' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // Magic Motion Engine
        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('magicCursor');
            const follower = document.getElementById('magicFollower');
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';

            document.querySelectorAll('.magical-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });
        });

        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mouseenter', () => document.getElementById('magicCursor').style.transform = 'scale(4)');
            el.addEventListener('mouseleave', () => document.getElementById('magicCursor').style.transform = 'scale(1)');
        });

        function logout() { localStorage.removeItem('authToken'); window.location.href = '/'; }
        function viewResults() { window.location.href = '/api/my-results/'; }
        function downloadReportCard() { window.location.href = '/api/my-report-card/'; }
        function viewAttendance() { window.scrollTo({ top: 500, behavior: 'smooth' }); } // Quick scroll
        function viewAssignments() { showToast('Loading Assignments via LMS...', 'success'); }
        function viewFees() { alert("Your fee status is: PENDING"); } // Placeholder
        function viewTimetable() { alert("Timetable is being generated by AI Scheduler."); }

        async function loadExams() {
            try {
                // Verify endpoint first - typically /api/online-exams/
                const res = await fetch(`${API_BASE}/online-exams/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                const container = document.getElementById('examsList');

                if (!res.ok || (data.results && data.results.length === 0) || (Array.isArray(data) && data.length === 0)) {
                    container.innerHTML = 'No upcoming exams scheduled.';
                    return;
                }

                const exams = data.results || data; // Handle pagination or list

                container.innerHTML = exams.map(exam => {
                    const now = new Date();
                    const start = new Date(exam.start_window);
                    const end = new Date(exam.end_window);

                    let statusBtn = '';
                    if (now < start) {
                        statusBtn = `<span class="px-3 py-1 bg-slate-700 text-slate-400 rounded-lg text-xs">Starts ${start.toLocaleDateString()}</span>`;
                    } else if (now > end) {
                        statusBtn = `<span class="px-3 py-1 bg-red-900/30 text-red-400 rounded-lg text-xs">Expired</span>`;
                    } else {
                        statusBtn = `<a href="/portal/exam/${exam.id}/" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-orange-600 text-white rounded-lg text-xs font-bold shadow-lg shadow-orange-500/20 hover:scale-105 transition">Start Exam <i class="fa-solid fa-arrow-right ml-1"></i></a>`;
                    }

                    return `
                        <div class="flex items-center justify-between p-4 mb-3 bg-slate-800/50 rounded-xl border border-slate-700/50 hover:border-amber-500/30 transition group">
                            <div>
                                <h3 class="font-bold text-white group-hover:text-amber-400 transition">${exam.title}</h3>
                                <div class="text-xs text-slate-400 mt-1">
                                    <i class="fa-solid fa-clock mr-1"></i> ${exam.duration_minutes} mins | ${exam.total_marks} Marks
                                </div>
                            </div>
                            <div>${statusBtn}</div>
                        </div>
                    `;
                }).join('');

            } catch (e) {
                console.error("Exams Error:", e);
                document.getElementById('examsList').innerHTML = 'System Update: Exam module syncing...';
            }
        }

        loadStudentData();
        loadAttendance();
        loadExams();
        loadAcademicDNA();
    </script>
    <style>
        @keyframes floatMagic {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(50px, 30px) rotate(45deg);
            }
        }
    </style>
</body>

</html>
